<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>dsh-free-api-pool — UI harness</title>
<style>
  /* Stand-in for the harness shell: just enough theme tokens for the panel to sit on. */
  :root {
    --dsw-alias-bg-layer-1: #ffffff;
    --dsw-alias-bg-layer-2: #eff1f4;
    --dsw-alias-bg-overlay: #ffffff;
    --dsw-alias-label-primary: #0e1115;
    --dsw-alias-label-secondary: #5b6470;
    --dsw-alias-border-l1: #e7eaef;
  }
  /* ?theme=dark swaps the same tokens, which is exactly what the real app does. */
  html.dark {
    --dsw-alias-bg-layer-1: #0e1115;
    --dsw-alias-bg-layer-2: #161a20;
    --dsw-alias-bg-overlay: #161a20;
    --dsw-alias-label-primary: #eff1f4;
    --dsw-alias-label-secondary: #a8b3c2;
    --dsw-alias-border-l1: #333942;
  }
  html, body { margin: 0; height: 100%; background: #f5f6f8; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
  html.dark body { background: #0a0d12; }
  #composer { position: fixed; left: 24px; bottom: 24px; display: flex; align-items: center; gap: 12px;
    padding: 10px 14px; background: #fff; border: 1px solid #e7eaef; border-radius: 16px; }
  html.dark #composer { background: #161a20; border-color: #333942; }
  #composer .fake-model { font-size: 12px; color: #5b6470; border: 1px solid #e7eaef; border-radius: 12px; padding: 4px 10px; }
  html.dark #composer .fake-model { color: #a8b3c2; border-color: #333942; }
  #dock-row { position: fixed; left: 24px; bottom: 68px; z-index: 26; display: flex; justify-content: center; align-items: center; gap: 12px; }
  .fake-controls { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .fake-reasoning { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .fake-reasoning-label, .fake-reasoning-value { font-size: 12px; color: #5b6470; }
  html.dark .fake-reasoning-label, html.dark .fake-reasoning-value { color: #a8b3c2; }
  .fake-slider { width: 120px; accent-color: #0065fd; }
</style>
</head>
<body>
  <!-- Host's composer.dock row: the plugin's picker lives here, on its own row. -->
  <div id="dock-row">
    <span id="slot-dock"></span>
  </div>
  <!-- Host's .standardControls row: model selector + reasoning slider must stay intact. -->
  <div id="composer">
    <span id="slot-left"></span>
    <div class="fake-controls">
      <span id="slot-model"></span>
      <button class="fake-model">Deepseek-V4.1-Flash · x0.11 <span class="fake-caret">▾</span></button>
      <div class="fake-reasoning">
        <span class="fake-reasoning-label">推理等级</span>
        <input type="range" class="fake-slider" min="0" max="3" value="2" />
        <span class="fake-reasoning-value">High</span>
      </div>
    </div>
  </div>
  <div id="slot-overlay"></div>

  <script src="/react.js"></script>
  <script src="/react-dom.js"></script>
  <script>
    window.onerror = function (msg, src, line, col, err) {
      const box = document.createElement('pre')
      box.style.cssText = 'position:fixed;inset:0;z-index:9999;background:#200;color:#f99;font:12px monospace;padding:16px;overflow:auto;white-space:pre-wrap'
      box.textContent = 'RENDER ERROR: ' + msg + '\n' + (err && err.stack ? err.stack : '') + '\n' + src + ':' + line + ':' + col
      document.body.appendChild(box)
    }
  </script>
  <script>
    // Minimal stand-ins for the two harness globals client.js touches.
    const React = window.React
    const ReactDOM = window.ReactDOM
    const modules = {}

    const params = new URLSearchParams(location.search)
    if (params.get('theme') === 'dark') document.documentElement.classList.add('dark')

    window.__ModuleLoader__ = {
      load(def) {
        const mod = def.factory((name) => {
          if (name === 'react') return React
          if (modules[name]) return modules[name]
          throw new Error('unknown module: ' + name)
        })
        modules[def.id] = mod
        boot(mod)
      },
    }

    // A slots service with the same shape the plugin uses: inject() registers a factory,
    // and the harness renders whatever was registered into the matching element.
    function boot(plugin) {
      const seats = { 'conversation.input.left': [], 'conversation.input.overlay': [], 'conversation.input.model': [] }
      const ctx = {
        effect(fn) { fn() },
        slots: {
          inject(name, factory) { factory() },
          register(spec, render) { seats[spec.name].push({ spec, render }); return () => {} },
        },
      }
      plugin.apply(ctx)

      const left = document.getElementById('slot-left')
      const overlay = document.getElementById('slot-overlay')
      ReactDOM.createRoot(left).render(seats['conversation.input.left'][0].render({}))
      ReactDOM.createRoot(overlay).render(seats['conversation.input.overlay'][0].render({}))
      const model = document.getElementById('slot-model')
      if (model !== null && seats['conversation.input.model'].length > 0) {
        ReactDOM.createRoot(model).render(seats['conversation.input.model'][0].render({}))
      }

      // Auto-open so a screenshot shows the panel without a click.
      setTimeout(() => {
        const btn = left.querySelector('button')
        if (btn) btn.click()
      }, 120)

      // ?demo=add preselects a platform and a key, so the discovery path can be driven
      // without a native select interaction (Playwright's selectOption is not exposed here).
      const demo = new URLSearchParams(location.search).get('demo')

      if (demo === 'expand') {
        setTimeout(() => {
          const btns = [...document.querySelectorAll('.dfp-expand')]
          if (btns[0]) btns[0].click()
        }, 600)
      }

      // ?demo=speed opens the 密钥 tab and runs both speed tests.
      if (demo === 'speed') {
        setTimeout(() => {
          const tab = [...document.querySelectorAll('.dfp-tab')].find((el) => el.textContent.includes('密钥'))
          if (tab) tab.click()
          setTimeout(() => {
            const buttons = [...document.querySelectorAll('.dfp-key button.dfp-mini')]
            buttons.slice(0, 2).forEach((b, i) => setTimeout(() => b.click(), i * 300))
          }, 500)
        }, 400)
      }

      if (demo === 'add') {
        setTimeout(() => {
          const tab = [...document.querySelectorAll('.dfp-tab')].find((el) => el.textContent.includes('密钥'))
          if (tab) tab.click()
          setTimeout(() => {
            const select = document.querySelector('.dfp-form select')
            const setter = Object.getOwnPropertyDescriptor(window.HTMLSelectElement.prototype, 'value').set
            setter.call(select, 'groq')
            select.dispatchEvent(new Event('change', { bubbles: true }))
            setTimeout(() => {
              const key = document.querySelector('.dfp-form input[type=password]')
              const kset = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, 'value').set
              kset.call(key, 'gsk_test_key_for_ui_harness_only')
              key.dispatchEvent(new Event('input', { bubbles: true }))
            }, 200)
          }, 200)
        }, 400)
      }
    }
  </script>
  <script src="/client.js?bust=v15"></script>
</body>
</html>
