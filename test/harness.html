<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>dsh-free-api-pool — UI harness</title>
<style>
  /* Stand-in for the harness shell: just enough theme tokens for the panel to sit on. */
  :root {
    --dsw-alias-bg-layer-1: #ffffff;
    --dsw-alias-bg-layer-2: #eff1f4;
    --dsw-alias-bg-overlay: #ffffff;
    --dsw-alias-label-primary: #0e1115;
    --dsw-alias-label-secondary: #5b6470;
    --dsw-alias-border-l1: #e7eaef;
  }
  html, body { margin: 0; height: 100%; background: #f5f6f8; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
  #composer { position: fixed; left: 24px; bottom: 24px; display: flex; align-items: center; gap: 12px;
    padding: 10px 14px; background: #fff; border: 1px solid #e7eaef; border-radius: 16px; }
  #composer .fake-model { font-size: 12px; color: #5b6470; border: 1px solid #e7eaef; border-radius: 12px; padding: 4px 10px; }
</style>
</head>
<body>
  <div id="composer">
    <span id="slot-left"></span>
    <span class="fake-model">mimo-v2.6-flash-free ▾</span>
  </div>
  <div id="slot-overlay"></div>

  <script src="/react.js"></script>
  <script src="/react-dom.js"></script>
  <script>
    // Minimal stand-ins for the two harness globals client.js touches.
    const React = window.React
    const ReactDOM = window.ReactDOM
    const modules = {}

    window.__ModuleLoader__ = {
      load(def) {
        const mod = def.factory((name) => {
          if (name === 'react') return React
          if (modules[name]) return modules[name]
          throw new Error('unknown module: ' + name)
        })
        modules[def.id] = mod
        boot(mod)
      },
    }

    // A slots service with the same shape the plugin uses: inject() registers a factory,
    // and the harness renders whatever was registered into the matching element.
    function boot(plugin) {
      const seats = { 'conversation.input.left': [], 'conversation.input.overlay': [] }
      const ctx = {
        effect(fn) { fn() },
        slots: {
          inject(name, factory) { factory() },
          register(spec, render) { seats[spec.name].push({ spec, render }); return () => {} },
        },
      }
      plugin.apply(ctx)

      const left = document.getElementById('slot-left')
      const overlay = document.getElementById('slot-overlay')
      ReactDOM.createRoot(left).render(seats['conversation.input.left'][0].render({}))
      ReactDOM.createRoot(overlay).render(seats['conversation.input.overlay'][0].render({}))

      // Auto-open so a screenshot shows the panel without a click.
      setTimeout(() => {
        const btn = left.querySelector('button')
        if (btn) btn.click()
      }, 120)

      // ?demo=add preselects a platform and a key, so the discovery path can be driven
      // without a native select interaction (Playwright's selectOption is not exposed here).
      const demo = new URLSearchParams(location.search).get('demo')
      if (demo === 'add') {
        setTimeout(() => {
          const tab = [...document.querySelectorAll('.dfp-tab')].find((el) => el.textContent.includes('密钥'))
          if (tab) tab.click()
          setTimeout(() => {
            const select = document.querySelector('.dfp-form select')
            const setter = Object.getOwnPropertyDescriptor(window.HTMLSelectElement.prototype, 'value').set
            setter.call(select, 'groq')
            select.dispatchEvent(new Event('change', { bubbles: true }))
            setTimeout(() => {
              const key = document.querySelector('.dfp-form input[type=password]')
              const kset = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, 'value').set
              kset.call(key, 'gsk_test_key_for_ui_harness_only')
              key.dispatchEvent(new Event('input', { bubbles: true }))
            }, 200)
          }, 200)
        }, 400)
      }
    }
  </script>
  <script src="/client.js"></script>
</body>
</html>
